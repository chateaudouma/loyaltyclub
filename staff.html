<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Owner & Staff — Château Douma Loyalty Club</title>
<meta name="theme-color" content="#172C23">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Douma Staff">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/staff.webmanifest">
<link rel="icon" href="/favicon.png">
<link rel="apple-touch-icon" href="/staff-apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/style.css">
<script src="/jsQR.js" defer></script>
<script src="/qrcode.js" defer></script>
<script src="/terms.js"></script>
<style>
  body{background:var(--ivory)}
  /* PIN screen */
  #pin{min-height:100vh;background:var(--green-dark);color:var(--ivory);display:flex;flex-direction:column;align-items:center;padding:calc(56px + env(safe-area-inset-top)) 24px 32px}
  .keypad{display:grid;grid-template-columns:repeat(3,76px);gap:16px 22px;justify-content:center;margin-top:22px}
  .key{width:76px;height:76px;border-radius:50%;border:none;background:var(--green-mid);color:var(--ivory);font:500 26px var(--sans);cursor:pointer}
  .key:active{background:#2F5A42}.key.plain{background:transparent;color:var(--gold-light);font-size:16px;font-weight:600}
  .dots{display:flex;gap:14px;min-height:16px;margin-top:24px}.dots i{width:14px;height:14px;border-radius:50%;background:var(--gold)}.dots i.e{background:none;border:1.5px solid #6F8378}
  /* shell */
  .shell{display:flex;min-height:100vh}
  aside{width:230px;background:var(--green-dark);color:var(--ivory);padding:22px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;flex:none}
  aside button{background:none;border:none;color:var(--sage);font:600 14px var(--sans);text-align:left;padding:12px 14px;border-radius:12px;cursor:pointer;display:flex;gap:10px;align-items:center}
  aside button.on{background:var(--green-mid);color:var(--ivory)}
  main.content{flex:1;min-width:0;padding:24px 28px 60px;max-width:1100px}
  .topbar{display:none}
  @media (max-width:899px){
    aside{display:none}
    .topbar{display:flex;position:sticky;top:0;z-index:30;background:var(--green-dark);color:var(--ivory);padding:calc(10px + env(safe-area-inset-top)) 14px 0;flex-direction:column;gap:8px}
    .topbar nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
    .topbar nav::-webkit-scrollbar{display:none}
    .topbar nav button{flex:none;background:var(--green-mid);border:none;color:var(--sage);font:600 13px var(--sans);padding:9px 14px;border-radius:99px;cursor:pointer;min-height:38px}
    .topbar nav button.on{background:var(--gold);color:var(--ink)}
    main.content{padding:16px 14px 60px}
  }
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
  .metric{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px}
  .metric .k{font-size:11px;letter-spacing:1px;color:var(--muted2);font-weight:600;text-transform:uppercase}
  .metric .v{font-size:22px;font-weight:700;margin-top:4px;font-family:var(--serif)}
  .metric .s{font-size:12px;color:var(--muted);margin-top:2px}
  .list{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .li{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line);font-size:14px}
  .li:last-child{border-bottom:none}
  button.li{width:100%;background:none;border-left:none;border-right:none;border-top:none;text-align:left;cursor:pointer;font:inherit;color:inherit}
  button.li:hover{background:var(--field)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
  th{font-size:11px;letter-spacing:.8px;color:var(--muted2);text-transform:uppercase;background:var(--paper);position:sticky;top:0}
  .tablewrap{overflow:auto;max-height:70vh;background:var(--paper);border:1px solid var(--line);border-radius:14px}
  .seg{display:inline-flex;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;flex-wrap:wrap}
  .seg button{border:none;background:none;padding:8px 12px;border-radius:9px;font:600 13px var(--sans);color:var(--muted);cursor:pointer;min-height:36px}
  .seg button.on{background:var(--green);color:var(--ivory)}
  .cam{position:relative;aspect-ratio:4/3;max-height:380px;border-radius:20px;background:#0C1712;overflow:hidden;display:flex;align-items:center;justify-content:center}
  .cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .cam .frame{position:relative;width:55%;aspect-ratio:1;border:3px solid var(--gold);border-radius:22px;pointer-events:none}
  dialog{border:none;border-radius:20px;padding:0;max-width:520px;width:calc(100% - 24px);background:var(--ivory);max-height:92vh}
  dialog::backdrop{background:rgba(23,44,35,.55)}
  .sum{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
  .sum.big{font-size:18px;font-weight:700;border-bottom:none}
  .bars{display:flex;align-items:flex-end;gap:3px;height:120px;padding-top:8px}
  .bars i{flex:1;background:linear-gradient(180deg,var(--gold),#B58A38);border-radius:4px 4px 0 0;min-height:2px}
  .step{display:flex;align-items:center;gap:8px}
  .step button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line2);background:var(--field);font-size:20px;cursor:pointer}
  .chk{display:flex;gap:8px;flex-wrap:wrap}
  @media print{ body *{visibility:hidden} #poster,#poster *{visibility:visible} #poster{position:fixed;inset:0;margin:auto;border:none;max-width:none} }
  .chk label{display:flex;gap:6px;align-items:center;background:var(--field);border:1px solid var(--line2);border-radius:10px;padding:8px 10px;font-size:13px}
</style>
</head>
<body>

<!-- ============ PIN ============ -->
<section id="pin" class="hidden">
  <img src="/monogram.png" alt="Château Douma" style="width:80px">
  <div class="eyebrow" style="margin-top:16px;color:var(--gold-light)">Owner & staff</div>
  <h1 style="margin-top:8px">Enter your PIN</h1>
  <div class="dots" id="dots" aria-live="polite"></div>
  <div id="pinErr" role="alert" style="min-height:22px;margin-top:10px;font-size:13px;color:#FFB4A8"></div>
  <div class="keypad" id="keypad"></div>
  <p class="small" style="margin-top:28px;color:var(--sage2);text-align:center;max-width:300px">Each person signs in with their own PIN, so every transaction shows who made it.</p>
</section>

<!-- ============ APP ============ -->
<div id="app" class="hidden">
  <div class="topbar"><div class="row between"><div class="row"><img src="/monogram.png" alt="" style="height:30px"><b class="serif" style="font-size:19px" id="whoTop"></b></div><button class="link" style="color:var(--gold-light)" data-lock>Lock</button></div><nav id="navTop"></nav></div>
  <div class="shell">
    <aside><div class="row" style="padding:0 8px 18px"><img src="/monogram.png" alt="" style="height:34px"><div><div class="serif" style="font-size:18px">Château Douma</div><div class="small" style="color:var(--sage2)" id="whoSide"></div></div></div><div id="navSide" class="stack" style="gap:2px"></div><div style="flex:1"></div><button data-lock>Lock</button></aside>
    <main class="content" id="view"></main>
  </div>
</div>

<dialog id="dlg"><form method="dialog" id="dlgForm" class="stack" style="padding:20px;gap:14px"></form></dialog>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let TOKEN = localStorage.getItem('douma_staff_tok') || sessionStorage.getItem('douma_tok') || '';
let ME = null, SET = null, CURRENT = null, VIEW = null;
const SYM = () => SET?.currency?.symbol || '$';
const M = (c) => doumaMoney(c || 0, SYM());
const TZ = () => SET?.timezone || 'Asia/Beirut';
const fd = (iso) => iso ? new Date(iso).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', timeZone: TZ() }) : '—';
const ft = (iso) => iso ? new Date(iso).toLocaleString('en-GB', { day: 'numeric', month: 'short', year: '2-digit', hour: '2-digit', minute: '2-digit', timeZone: TZ() }) : '—';
const tierName = (k) => SET?.tiers.find((t) => t.key === k)?.name || k;
const toast = (t) => { const d = document.createElement('div'); d.className = 'toast'; d.style.bottom = '24px'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 3000); };
const toMoney = (s) => s === '' || s == null ? '' : String(s).replace(',', '.');

async function api(path, body, method) {
  const r = await fetch('/api' + path, { method: method || (body ? 'POST' : 'GET'), headers: { 'content-type': 'application/json', authorization: 'Bearer ' + TOKEN }, body: body ? JSON.stringify(body) : undefined, cache: 'no-store' });
  if (r.status === 401) { lock(); throw new Error('Please sign in again.'); }
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || 'Something went wrong.');
  return d;
}
async function download(path) {
  const r = await fetch('/api' + path, { headers: { authorization: 'Bearer ' + TOKEN } });
  if (!r.ok) return toast('Export failed');
  const name = (r.headers.get('content-disposition') || '').match(/filename="([^"]+)"/)?.[1] || 'export.csv';
  const a = document.createElement('a'); a.href = URL.createObjectURL(await r.blob()); a.download = name; a.click();
}

// ============ PIN ============
let typed = '';
function drawPin() { $('dots').innerHTML = Array.from({ length: Math.max(4, typed.length) }, (_, i) => `<i class="${i < typed.length ? '' : 'e'}"></i>`).join(''); }
$('keypad').innerHTML = ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'del', '0', 'ok'].map((k) => k === 'del' ? '<button class="key plain" data-k="del" aria-label="Delete">⌫</button>' : k === 'ok' ? '<button class="key plain" data-k="ok">Enter</button>' : `<button class="key" data-k="${k}">${k}</button>`).join('');
$('keypad').onclick = (e) => { const k = e.target.closest('button')?.dataset.k; if (k) press(k); };
document.addEventListener('keydown', (e) => { if ($('pin').classList.contains('hidden')) return; if (/^\d$/.test(e.key)) press(e.key); else if (e.key === 'Backspace') press('del'); else if (e.key === 'Enter') press('ok'); });
function press(k) { $('pinErr').textContent = ''; if (k === 'del') typed = typed.slice(0, -1); else if (k === 'ok') return login(); else if (typed.length < 10) typed += k; drawPin(); }
async function login() {
  if (typed.length < 4) { $('pinErr').textContent = 'PINs have at least 4 digits.'; return; }
  try {
    const r = await fetch('/api/auth/login', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ pin: typed }) });
    const d = await r.json(); if (!r.ok) throw new Error(d.error);
    TOKEN = d.token;
    localStorage.setItem('douma_staff_tok', TOKEN); // stays signed in on this device (30 days) until Lock is tapped
    await start();
  } catch (e) { $('pinErr').textContent = e.message; }
  typed = ''; drawPin();
}
function lock() { TOKEN = ''; sessionStorage.removeItem('douma_tok'); localStorage.removeItem('douma_staff_tok'); stopCam(); $('app').classList.add('hidden'); $('pin').classList.remove('hidden'); typed = ''; drawPin(); }
document.querySelectorAll('[data-lock]').forEach((b) => b.onclick = lock);

// ============ SHELL ============
const NAV_OWNER = [['dashboard', 'Dashboard'], ['scan', 'Scan Member'], ['customers', 'Customers'], ['transactions', 'Transactions'], ['campaigns', 'Campaigns'], ['analytics', 'Analytics'], ['staff', 'Staff'], ['settings', 'Settings']];
const NAV_STAFF = [['scan', 'Scan Member']];
async function start() {
  ME = await api('/auth/me');
  SET = await (await fetch('/api/public/settings')).json();
  $('pin').classList.add('hidden'); $('app').classList.remove('hidden');
  const nav = ME.role === 'owner' ? NAV_OWNER : NAV_STAFF;
  $('whoTop').textContent = ME.role === 'owner' ? 'Owner' : ME.name; $('whoSide').textContent = ME.role === 'owner' ? 'Owner' : 'Staff · ' + ME.name;
  const btns = nav.map(([k, t]) => `<button data-nav="${k}">${t}</button>`).join('');
  $('navSide').innerHTML = btns; $('navTop').innerHTML = nav.length > 1 ? btns : '';
  document.querySelectorAll('[data-nav]').forEach((b) => b.onclick = () => go(b.dataset.nav));
  go(ME.role === 'owner' ? 'dashboard' : 'scan');
}
let PREV = 'scan';
function go(v, arg) {
  if (v !== 'scan') stopCam();
  if (v === 'member' && VIEW && VIEW !== 'member') PREV = VIEW;
  VIEW = v;
  document.querySelectorAll('[data-nav]').forEach((b) => b.classList.toggle('on', b.dataset.nav === v || (v === 'member' && b.dataset.nav === 'scan')));
  $('view').innerHTML = '<div style="display:flex;justify-content:center;padding:60px"><div class="spinner"></div></div>';
  scrollTo(0, 0);
  Promise.resolve(VIEWS[v](arg)).catch((e) => { $('view').innerHTML = `<div class="error">${esc(e.message)}</div>`; });
}
const set = (html) => { $('view').innerHTML = html; };
const on = (id, ev, fn) => { const el = $(id); if (el) el[ev] = fn; };

// ============ DIALOG HELPER ============
// Opens a form dialog; keeps it open with the error message until the action succeeds or is closed.
function act(title, fieldsHtml, submitLabel, fn, danger) {
  return new Promise((resolve) => {
    const d = $('dlg'), f = $('dlgForm');
    f.innerHTML = `<div class="row between"><h2>${title}</h2><button type="button" class="link" id="dlgX">Close</button></div>${fieldsHtml}<div id="dlgErr" class="error hidden" role="alert"></div><button class="btn ${danger ? 'btn-danger' : 'btn-green'} full" id="dlgGo">${submitLabel}</button>`;
    d.showModal();
    $('dlgX').onclick = () => { d.close(); resolve(false); };
    f.onsubmit = async (e) => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(f).entries());
      f.querySelectorAll('input[type=checkbox]').forEach((c) => { if (c.name) data[c.name] = c.checked; });
      $('dlgGo').disabled = true;
      try { await fn(data); d.close(); resolve(true); }
      catch (err) { $('dlgErr').textContent = err.message; $('dlgErr').classList.remove('hidden'); $('dlgGo').disabled = false; }
    };
  });
}
const reasonField = '<div class="field"><label class="label" for="f_reason">Reason (required, kept in the audit log)</label><input id="f_reason" name="reason" required maxlength="300"></div>';

// ============ RANGE HELPER ============
let RANGE = { key: 'month' };
function rangeOf(k, from, to) {
  const n = new Date(); const sod = new Date(n.getFullYear(), n.getMonth(), n.getDate());
  if (k === 'today') return [sod, new Date(+sod + 864e5)];
  if (k === 'week') { const d = new Date(sod); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return [d, new Date(+sod + 864e5)]; }
  if (k === 'month') return [new Date(n.getFullYear(), n.getMonth(), 1), new Date(+sod + 864e5)];
  if (k === 'year') return [new Date(n.getFullYear(), 0, 1), new Date(+sod + 864e5)];
  return [new Date(from + 'T00:00'), new Date(new Date(to + 'T00:00').getTime() + 864e5)];
}
function rangeBar(id) {
  const k = RANGE.key;
  return `<div class="row wrap-row" style="gap:8px"><div class="seg" id="${id}">${[['today', 'Today'], ['week', 'This week'], ['month', 'This month'], ['year', 'This year'], ['custom', 'Custom']].map(([a, b]) => `<button data-r="${a}" class="${k === a ? 'on' : ''}">${b}</button>`).join('')}</div>
    <div class="row ${k === 'custom' ? '' : 'hidden'}" id="${id}C"><input type="date" id="${id}F" value="${RANGE.from || ''}" style="height:40px;width:auto"><span>to</span><input type="date" id="${id}T" value="${RANGE.to || ''}" style="height:40px;width:auto"><button class="btn btn-green btn-sm" id="${id}Go">Apply</button></div></div>`;
}
function bindRange(id, reload) {
  document.querySelectorAll(`#${id} button`).forEach((b) => b.onclick = () => { RANGE.key = b.dataset.r; if (b.dataset.r !== 'custom') reload(); else { document.querySelectorAll(`#${id} button`).forEach((x) => x.classList.toggle('on', x === b)); $(id + 'C').classList.remove('hidden'); } });
  on(id + 'Go', 'onclick', () => { RANGE.from = $(id + 'F').value; RANGE.to = $(id + 'T').value; if (RANGE.from && RANGE.to) reload(); });
}
const rangeQS = () => { const [a, b] = rangeOf(RANGE.key, RANGE.from, RANGE.to); return `from=${encodeURIComponent(a.toISOString())}&to=${encodeURIComponent(b.toISOString())}`; };

// ============ VIEWS ============
const VIEWS = {};

// ---------- Dashboard ----------
VIEWS.dashboard = async () => {
  const [a, t, tx] = await Promise.all([api('/owner/analytics?' + (RANGE.key = 'month', rangeQS())), api('/staff/today'), api('/owner/transactions?' + rangeQS())]);
  set(`<div class="row between wrap-row" style="margin-bottom:14px"><div><div class="eyebrow">Dashboard</div><h1>Good ${new Date().getHours() < 12 ? 'morning' : new Date().getHours() < 18 ? 'afternoon' : 'evening'}</h1></div>
      <div class="row"><button class="btn btn-gold" id="dScan">Scan member</button><button class="btn btn-light" id="dMsg">Send message</button></div></div>
    <div class="cards">
      <div class="metric"><div class="k">Today</div><div class="v">${M(t.sales)}</div><div class="s">${t.purchases} purchases · ${t.joins} joined</div></div>
      <div class="metric"><div class="k">Members</div><div class="v">${a.members.total}</div><div class="s">${a.members.newThisMonth} new this month</div></div>
      ${SET.tiers.map((x) => `<div class="metric"><span class="badge tier-${x.key}">${esc(x.name)}</span><div class="v">${a.members[x.key]}</div></div>`).join('')}
      <div class="metric"><div class="k">Sales this month</div><div class="v">${M(a.sales)}</div><div class="s">eligible member sales</div></div>
      <div class="metric"><div class="k">Cashback issued</div><div class="v">${M(a.issued)}</div><div class="s">${a.costPercent}% of sales</div></div>
      <div class="metric"><div class="k">Cashback redeemed</div><div class="v">${M(a.redeemed)}</div></div>
      <div class="metric"><div class="k">Outstanding balances</div><div class="v">${M(a.outstanding)}</div></div>
    </div>
    <div class="grid2" style="margin-top:16px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))">
      <div class="stack" style="gap:8px"><h3>Recent transactions</h3><div class="list">${tx.events.slice(0, 8).map(evRow).join('') || '<div class="li muted">No transactions yet this month.</div>'}</div></div>
      <div class="stack" style="gap:8px"><h3>Close to the next level</h3><div class="list">${a.approaching.slice(0, 8).map((x) => `<button class="li" data-mem="${x.id}"><span><b>${esc(x.name)}</b> <span class="small muted">#${x.id}</span></span><span class="small">${M(x.next.remaining)} to <span class="badge tier-${SET.tiers.find((t) => t.name === x.next.name)?.key}">${esc(x.next.name)}</span></span></button>`).join('') || '<div class="li muted">Nobody close to an upgrade right now.</div>'}</div></div>
    </div>`);
  on('dScan', 'onclick', () => go('scan')); on('dMsg', 'onclick', () => go('campaigns'));
  bindMem();
};
function evRow(e) {
  const typeLabel = { purchase: e.cat, refund: 'Refund', reversal: 'Correction', welcome: 'Welcome reward', 'welcome-unlock': 'Welcome unlocked', birthday: 'Birthday reward', complimentary: 'Complimentary', adjustment: 'Adjustment', expire: 'Expired', tier: e.label, stamp: e.label }[e.type] || e.type;
  const amt = e.type === 'purchase' ? `${M(e.paid)}${e.earned ? ` <span class="pos">+${M(e.earned)}</span>` : ''}${e.red ? ` <span class="neg">−${M(e.red)}</span>` : ''}`
    : e.rew ? `<span class="pos">+${M(e.rew)}</span>` : e.exp ? `<span class="muted">−${M(e.exp)}</span>` : e.adj ? `<span class="${e.adj > 0 ? 'pos' : 'neg'}">${e.adj > 0 ? '+' : '−'}${M(Math.abs(e.adj))}</span>` : e.refund ? `<span class="neg">−${M(e.refund)}</span>` : '';
  return `<button class="li" data-mem="${e.m}"><span><b>${esc(e.name || e.m)}</b><br><span class="small muted">${esc(typeLabel || '')} · ${ft(e.at)}${e.by ? ' · ' + esc(e.by) : ''}</span></span><span class="right small" style="font-weight:600">${amt}</span></button>`;
}
const bindMem = () => document.querySelectorAll('[data-mem]').forEach((b) => b.onclick = () => go('member', b.dataset.mem));

// ---------- Scan ----------
let stream = null, scanning = false;
const canvas = document.createElement('canvas'), cctx = canvas.getContext('2d', { willReadFrequently: true });
VIEWS.scan = async () => {
  set(`<div class="eyebrow">Scan member</div><h1 style="margin-bottom:14px">Find a member</h1>
    <div class="grid2" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;align-items:start">
      <div class="stack">
        <form id="idForm" class="panel stack" style="gap:8px"><label class="label" for="qid">Member number</label>
          <div class="row"><span class="serif" style="font-size:22px;color:var(--gold-text);flex:none">CD</span><input id="qid" inputmode="numeric" placeholder="1001" autocomplete="off" style="font-size:20px;letter-spacing:2px"><button class="btn btn-gold" style="flex:none">Find</button></div></form>
        <form id="phForm" class="panel stack" style="gap:8px"><label class="label" for="qph">Phone number</label>
          <div class="row"><input id="qcc" aria-label="Country code" value="+961" inputmode="tel" style="width:84px;flex:none;text-align:center"><input id="qph" inputmode="tel" placeholder="71 234 567" autocomplete="off" style="font-size:18px"><button class="btn btn-gold" style="flex:none">Find</button></div></form>
        <form id="findForm" class="stack" style="gap:8px"><label class="label" for="q">Or search by name</label>

async function startCam() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1280 } }, audio: false });
    const v = $('video'); v.srcObject = stream; v.classList.remove('hidden'); await v.play();
    $('camStart').classList.add('hidden'); scanning = true; requestAnimationFrame(tick);
  } catch (e) { $('camMsg').textContent = 'Camera unavailable — allow camera access, or search instead.'; }
}
function stopCam() { scanning = false; if (stream) { stream.getTracks().forEach((t) => t.stop()); stream = null; } }
let lastScan = 0;
function tick(ts) {
  if (!scanning) return;
  const v = $('video');
  if (v && v.readyState >= 2 && ts - lastScan > 120 && window.jsQR) {
    lastScan = ts;
    const w = 480, h = Math.round(w * v.videoHeight / v.videoWidth) || 360;
    canvas.width = w; canvas.height = h; cctx.drawImage(v, 0, 0, w, h);
    const code = jsQR(cctx.getImageData(0, 0, w, h).data, w, h, { inversionAttempts: 'dontInvert' });
    if (code?.data) { navigator.vibrate?.(60); stopCam(); find(code.data); return; }
  }
  requestAnimationFrame(tick);
}
async function find(q) {

function txLine(x, own, canRefund) {

    p.push(`Invoice ${M(x.invoice)} · paid ${M(x.paid)}`);

    if (x.earned) p.push(`<span class="pos">+${M(x.earned)} earned</span>`);
    if (x.refunded) p.push(`<span class="neg">refunded ${M(x.refunded)}</span>`);
  } else if (x.reward) p.push(`<span class="pos">+${M(x.reward)}</span>`);
  else if (x.expired) p.push(`<span class="muted">−${M(x.expired)} expired</span>`);
  else if (x.adjust) p.push(`<span class="${x.adjust > 0 ? 'pos' : 'neg'}">${x.adjust > 0 ? '+' : '−'}${M(Math.abs(x.adjust))}</span>`);
  if (x.refund) p.push(`Refunded ${M(x.refund)}${x.restored ? ` · <span class="pos">+${M(x.restored)} returned</span>` : ''}${x.earnedReversed ? ` · <span class="neg">−${M(x.earnedReversed)} reversed</span>` : ''}${x.cashRefund !== undefined ? ` · cash back ${M(x.cashRefund)}` : ''}${x.shortfall ? ` · ${M(x.shortfall)} kept (cashback already spent)` : ''}`);
  const canRef = x.type === 'purchase' && canRefund && (x.refunded || 0) < x.invoice;
  const canRev = own && ['complimentary', 'adjustment', 'birthday'].includes(x.type) && !x.reversedBy;
  return `<div class="li" style="align-items:flex-start"><div class="grow"><b>${esc(x.type === 'purchase' ? x.category : x.label)}</b>${x.invoiceRef && !/^P-/.test(x.invoiceRef) ? ` <span class="small muted">${esc(x.invoiceRef)}</span>` : ''}
    <div class="small muted">${ft(x.at)}${x.by ? ' · ' + esc(x.by) : ''}</div><div class="small" style="margin-top:3px">${p.join(' · ')}</div>${x.reason || x.notes ? `<div class="small muted" style="margin-top:2px">“${esc(x.reason || x.notes)}”</div>` : ''}</div>
    <div class="stack right" style="gap:4px;align-items:flex-end">${x.balance !== undefined && x.type !== 'tier' ? `<span class="small muted">bal. ${M(x.balance)}</span>` : ''}${canRef ? `<button class="btn btn-ghost btn-sm" data-refund="${x.id}">Refund</button>` : ''}${canRev ? `<button class="btn btn-ghost btn-sm" data-reverse="${x.id}">Reverse</button>` : ''}</div></div>`;
}

async function campaignForm(c) {

  const loc = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  c = c || { name: '', description: '', startLocal: loc(new Date(now.setMinutes(0))), endLocal: loc(new Date(Date.now() + 3 * 864e5)), type: 'multiplier', value: 2, tiers: [], categories: [], maxPerTxCents: 0, maxPerCustomerCents: 0, enabled: true, stackable: false };
  const ideas = ['Double Cashback Weekend', 'Christmas Cashback', 'Independence Weekend Rewards', 'Exclusive Premium Member Rewards', 'Special Workshop Cashback', 'Extra Cashback on Selected Wines'];
  const ok = await act(c.id ? 'Edit campaign' : 'New campaign', `
    <div class="field"><label class="label">Campaign name</label><input name="name" value="${esc(c.name)}" list="ideas" required><datalist id="ideas">${ideas.map((i) => `<option value="${i}">`).join('')}</datalist></div>

    <div class="grid2"><div class="field"><label class="label">Starts (${esc(SET.timezone)})</label><input type="datetime-local" name="startLocal" value="${c.startLocal}" required></div><div class="field"><label class="label">Ends</label><input type="datetime-local" name="endLocal" value="${c.endLocal}" required></div></div>
    <div class="grid2"><div class="field"><label class="label">Type</label><select name="type"><option value="multiplier" ${c.type === 'multiplier' ? 'selected' : ''}>Multiplier (e.g. 2× cashback)</option><option value="fixed" ${c.type === 'fixed' ? 'selected' : ''}>Fixed percentage</option></select></div><div class="field"><label class="label">Value (× or %)</label><input name="value" inputmode="decimal" value="${c.value}"></div></div>
    <div class="field"><span class="label">Eligible levels (none ticked = all)</span><div class="chk">${SET.tiers.map((t) => `<label><input type="checkbox" name="tier_${t.key}" ${c.tiers.includes(t.key) ? 'checked' : ''}>${esc(t.name)}</label>`).join('')}</div></div>
    <div class="field"><span class="label">Eligible categories (none ticked = all eligible)</span><div class="chk">${SET.categories.filter((x) => x.eligible).map((x, i) => `<label><input type="checkbox" name="cat_${i}" data-cat="${esc(x.name)}" ${c.categories.includes(x.name) ? 'checked' : ''}>${esc(x.name)}</label>`).join('')}</div></div>
    <div class="grid2"><div class="field"><label class="label">Max bonus per purchase ($, 0 = none)</label><input name="maxPerTx" inputmode="decimal" value="${(c.maxPerTxCents || 0) / 100}"></div><div class="field"><label class="label">Max bonus per customer ($)</label><input name="maxPerCustomer" inputmode="decimal" value="${(c.maxPerCustomerCents || 0) / 100}"></div></div>
    <label class="row small"><input type="checkbox" name="enabled" ${c.enabled ? 'checked' : ''}> Enabled</label>
    <label class="row small"><input type="checkbox" name="stackable" ${c.stackable ? 'checked' : ''}> Can combine with other campaigns (only if stacking is allowed in Settings)</label>
    ${c.id ? '<label class="row small"><input type="checkbox" name="announce"> Also send an announcement to members now</label>' : '<label class="row small"><input type="checkbox" name="announce"> Send an announcement to members now</label>'}`, 'Save campaign', async (f) => {
    const cats = [...$('dlgForm').querySelectorAll('[data-cat]')].filter((x) => x.checked).map((x) => x.dataset.cat);
    const body = { id: c.id, name: f.name, description: f.description, startLocal: f.startLocal, endLocal: f.endLocal, type: f.type, value: Number(toMoney(f.value)), tiers: SET.tiers.filter((t) => f['tier_' + t.key]).map((t) => t.key), categories: cats, maxPerTx: toMoney(f.maxPerTx), maxPerCustomer: toMoney(f.maxPerCustomer), enabled: f.enabled, stackable: f.stackable };
    await api('/owner/campaigns', { campaign: body });

    <div class="field"><label class="label">${s ? 'New PIN (leave empty to keep)' : 'PIN (4–10 digits)'}</label><input name="pin" inputmode="numeric" pattern="\\d{4,10}" ${s ? '' : 'required'}></div>
    <label class="row small"><input type="checkbox" name="redeem" ${s?.perms?.redeem === false ? '' : 'checked'}> Can redeem cashback</label>
    <label class="row small"><input type="checkbox" name="refund" ${s?.perms?.refund ? 'checked' : ''}> Can process refunds</label>
    <label class="row small"><input type="checkbox" name="history" ${s?.perms?.history ? 'checked' : ''}> Can see full transaction history</label>
    ${s ? `<label class="row small"><input type="checkbox" name="active" ${s.active ? 'checked' : ''}> Active (untick to block access)</label>` : ''}`;
  on('sNew', 'onclick', async () => { if (await act('Add staff member', form(), 'Add', async (f) => api('/owner/staff', { action: 'create', name: f.name, pin: f.pin, perms: { redeem: f.redeem, refund: f.refund, history: f.history } }))) { toast('Staff member added'); go('staff'); } });
  document.querySelectorAll('[data-staff]').forEach((b) => b.onclick = async () => { const s = d.staff.find((x) => x.id === b.dataset.staff); if (await act('Edit ' + esc(s.name), form(s), 'Save', async (f) => api('/owner/staff', { action: 'update', id: s.id, name: f.name, pin: f.pin || undefined, active: f.active, perms: { redeem: f.redeem, refund: f.refund, history: f.history } }))) { toast('Saved'); go('staff'); } });
};

// ---------- Settings ----------
VIEWS.settings = async () => {
  const d = await api('/owner/settings'); const s = d.settings;
  const money = (c) => (c / 100).toFixed(2);
  set(`<div class="eyebrow">Settings</div><h1 style="margin-bottom:14px">Programme settings</h1>
  <form id="sf" class="stack" style="gap:18px;max-width:760px" novalidate>
    <div class="panel stack"><h3>Membership levels</h3>
      ${s.tiers.map((t, i) => `<div style="display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:end"><div class="field"><span class="badge tier-${t.key}" style="align-self:flex-start">${['Light red', 'Silver', 'Gold'][i]} card</span><input name="t${i}name" value="${esc(t.name)}" aria-label="Level ${i + 1} name"></div>
        <div class="field"><label class="label">Cashback %</label><input name="t${i}rate" inputmode="decimal" value="${t.rate}"></div>
        <div class="field"><label class="label">From spending ($)</label><input name="t${i}min" inputmode="decimal" value="${money(t.min)}" ${i === 0 ? 'disabled' : ''}></div></div>`).join('')}
      <p class="small muted">Card colours stay fixed per level: light red, silver and gold. Rate changes apply to new purchases only.</p></div>
    <div class="panel stack"><h3>Rewards</h3>
      <div class="grid2"><label class="row small"><input type="checkbox" name="wOn" ${s.welcome.enabled ? 'checked' : ''}> Welcome reward</label><div class="field"><label class="label">Amount ($)</label><input name="wAmt" inputmode="decimal" value="${money(s.welcome.amount)}"></div></div>
      <div class="grid3"><label class="row small"><input type="checkbox" name="bOn" ${s.birthday.enabled ? 'checked' : ''}> Birthday reward</label><div class="field"><label class="label">Amount ($)</label><input name="bAmt" inputmode="decimal" value="${money(s.birthday.amount)}"></div><div class="field"><label class="label">Valid (days)</label><input name="bDays" inputmode="numeric" value="${s.birthday.validDays}"></div></div>
      <div class="grid2"><label class="row small"><input type="checkbox" name="stOn" ${s.stamps.enabled ? 'checked' : ''}> Free glass for visits</label><div class="field"><label class="label">Visits for a free glass</label><input name="stGoal" inputmode="numeric" value="${s.stamps.goal}"></div></div></div>
    <div class="panel stack"><h3>Cashback rules</h3>
      <div class="grid2"><div class="field"><label class="label">Cashback expires after (months)</label><input name="expM" inputmode="numeric" value="${s.expiry.months}"></div><div class="field"><label class="label">Warn members (days before)</label><input name="expW" inputmode="numeric" value="${s.expiry.warnDays}"></div></div>
      <div class="grid2"><div class="field"><label class="label">Minimum redemption ($)</label><input name="rMin" inputmode="decimal" value="${money(s.redemption.minCents)}"></div><div class="field"><label class="label">Max % of an invoice payable with cashback</label><input name="rMax" inputmode="numeric" value="${s.redemption.maxPercentOfInvoice}"></div></div>
      <label class="row small"><input type="checkbox" name="rEx" ${s.redemption.allowOnExcluded ? 'checked' : ''}> Cashback can also pay for non-eligible items (gift cards etc.)</label>
      <label class="row small"><input type="checkbox" name="stack" ${s.campaigns.allowStacking ? 'checked' : ''}> Allow campaigns marked "can combine" to stack</label></div>
    <div class="panel stack"><h3>Purchase categories</h3><div id="cats" class="stack" style="gap:8px">${s.categories.map((c, i) => `<div class="row"><input name="c${i}" value="${esc(c.name)}"><label class="row small" style="flex:none"><input type="checkbox" name="c${i}e" ${c.eligible ? 'checked' : ''}> Earns cashback</label></div>`).join('')}</div>
      <button type="button" class="btn btn-light btn-sm" id="addCat" style="align-self:flex-start">Add category</button>
      <div class="field"><label class="label">Excluded products (note shown to staff and in the terms)</label><textarea name="excl" rows="2">${esc(s.excludedProducts)}</textarea></div></div>
    <div class="panel stack"><h3>Notifications sent to members</h3><div class="chk">${Object.entries({ earned: 'Cashback earned', redeemed: 'Cashback redeemed', upgrade: 'Membership upgraded', welcome: 'Welcome reward', birthday: 'Birthday reward', expiry: 'Cashback expiring', reversal: 'Refunds & corrections' }).map(([k, l]) => `<label><input type="checkbox" name="n_${k}" ${s.notifications[k] ? 'checked' : ''}>${l}</label>`).join('')}</div><p class="small muted">Campaign announcements only go to members who accepted news & offers.</p></div>
    <div class="panel stack"><h3>General</h3>
      <div class="grid3"><div class="field"><label class="label">Currency code</label><input name="cur" value="${esc(s.currency.code)}"></div><div class="field"><label class="label">Symbol</label><input name="sym" value="${esc(s.currency.symbol)}"></div><div class="field"><label class="label">Time zone</label><input name="tz" value="${esc(s.timezone)}"></div></div>
      <div class="grid2"><div class="field"><label class="label">"Close to next level" within ($)</label><input name="appr" inputmode="decimal" value="${money(s.approachingWithinCents)}"></div><div class="field"><label class="label">"Not visited recently" after (days)</label><input name="inact" inputmode="numeric" value="${s.inactiveDays}"></div></div>
      <div class="field"><label class="label">Extra terms & conditions (added under the standard terms)</label><textarea name="terms" rows="4">${esc(s.terms)}</textarea></div></div>
    <div class="panel stack"><h3>Connections</h3><div class="small">Apple Wallet: <b>${d.wallet.apple ? 'connected' : 'not set up'}</b> · Google Wallet: <b>${d.wallet.google ? 'connected' : 'not set up'}</b></div><p class="small muted">These are configured with Netlify environment variables — see the setup guide.</p></div>
    <div id="sErr" class="error hidden"></div>
    <div class="row" style="position:sticky;bottom:12px"><button class="btn btn-green grow" id="sSave" type="submit">Save settings</button></div>
  </form>
  <div class="panel stack" style="max-width:760px;margin-top:18px"><h3>Maintenance</h3><div class="row wrap-row"><button class="btn btn-light btn-sm" id="mDaily">Run daily check now (expiry, birthdays)</button><button class="btn btn-light btn-sm" id="mRebuild">Rebuild reports from ledgers</button></div></div>`);
  let catN = s.categories.length;
  on('addCat', 'onclick', () => { $('cats').insertAdjacentHTML('beforeend', `<div class="row"><input name="c${catN}" placeholder="Category name"><label class="row small" style="flex:none"><input type="checkbox" name="c${catN}e" checked> Earns cashback</label></div>`); catN++; });
  $('sf').onsubmit = async (e) => {
    e.preventDefault();
    const f = Object.fromEntries(new FormData($('sf')).entries()); const ck = (n) => $('sf').querySelector(`[name="${n}"]`)?.checked;
    const c = (v) => Math.round(parseFloat(toMoney(v) || 0) * 100);
    const next = {
      tiers: s.tiers.map((t, i) => ({ key: t.key, name: f[`t${i}name`], rate: parseFloat(toMoney(f[`t${i}rate`])), min: i === 0 ? 0 : c(f[`t${i}min`]) })),
      welcome: { enabled: ck('wOn'), amount: c(f.wAmt) }, birthday: { enabled: ck('bOn'), amount: c(f.bAmt), validDays: +f.bDays }, stamps: { enabled: ck('stOn'), goal: +f.stGoal },
      expiry: { months: +f.expM, warnDays: +f.expW }, redemption: { minCents: c(f.rMin), maxPercentOfInvoice: +f.rMax, allowOnExcluded: ck('rEx') }, campaigns: { allowStacking: ck('stack') },
      categories: Array.from({ length: catN }, (_, i) => ({ name: (f['c' + i] || '').trim(), eligible: ck('c' + i + 'e') })).filter((x) => x.name),
      excludedProducts: f.excl, notifications: Object.fromEntries(Object.keys(s.notifications).map((k) => [k, ck('n_' + k)])),
      currency: { code: f.cur, symbol: f.sym }, timezone: f.tz, approachingWithinCents: c(f.appr), inactiveDays: +f.inact, terms: f.terms,
    };
    try { await api('/owner/settings', { settings: next }); SET = await (await fetch('/api/public/settings')).json(); toast('Settings saved'); $('sErr').classList.add('hidden'); }
    catch (ex) { $('sErr').textContent = ex.message; $('sErr').classList.remove('hidden'); }
  };
  on('mDaily', 'onclick', async () => { try { const r = await api('/owner/run-daily', {}); toast(`Checked ${r.members} members`); } catch (e) { toast(e.message); } });
  on('mRebuild', 'onclick', async () => { try { const r = await api('/owner/rebuild', {}); toast(`Rebuilt from ${r.members} members`); } catch (e) { toast(e.message); } });
};

// ============ START ============
drawPin();
if (TOKEN) start().catch(() => lock()); else lock();

// ---------- auto-update: reload when a new version has been published ----------
let APP_VERSION = null;
async function checkForUpdate() {
  try {
    const v = (await (await fetch('/version.txt', { cache: 'no-store' })).text()).trim();
    if (!/^\d+$/.test(v)) return;
    if (!APP_VERSION) APP_VERSION = v;
    else if (v !== APP_VERSION && !document.querySelector('dialog[open]')) location.reload();
  } catch (_) {}
}
checkForUpdate();
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkForUpdate(); });
</script>
