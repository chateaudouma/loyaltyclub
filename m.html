<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="apple-mobile-web-app-title" content="Château Douma">
<meta name="application-name" content="Château Douma">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Château Douma membership card</title>
<link rel="manifest" href="/api/manifest">
<link rel="icon" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main style="max-width:420px;margin:0 auto;min-height:100vh;padding:48px 24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center">
  <img src="/logo.png" alt="Château Douma" style="width:200px">
  <div class="eyebrow">Loyalty Club</div>
  <h1 style="font-size:28px">This is a Château Douma membership card</h1>
  <p class="muted" style="font-size:15px;line-height:1.5">Our team scans this code to find the member. It does not show any personal details.</p>
  <a id="mine" class="btn btn-green full hidden" href="/card">Open my card</a>
  <a class="btn btn-light full" href="/join">Join the club</a>
  <a class="link" href="/staff">Staff app</a>
</main>
<script>const s = JSON.parse(localStorage.getItem('douma_card') || 'null'); if (s?.m) { const a = document.getElementById('mine'); a.href = `/card?m=${s.m}&t=${s.t}`; a.classList.remove('hidden'); }</script>
</body>
</html>
